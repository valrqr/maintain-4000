version: 2

models:
  - name: stg_flights
    description: One row per flight observed at LFMN (arrival or departure).
    columns:
      - name: flight_id
        data_tests: [unique, not_null]
      - name: direction
        data_tests:
          - accepted_values:
              arguments:
                values: ["arrival", "departure"]

  - name: stg_level_offs
    description: One row per level segment during descent (|VS| < 300 ft/min for >= 20 s).
    columns:
      - name: flight_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_flights')
                field: flight_id
